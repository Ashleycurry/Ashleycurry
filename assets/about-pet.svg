<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="t">
  <title id="t">XiaoGao desk pet: a chibi engineer in a sky-blue hoodie and headphones, beside a speech bubble that reveals an introduction line by line.</title>
  <style>
    .bob { animation: bob 3.6s ease-in-out infinite; }
    .arm { animation: wave 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 8%; }
    .ahoge { animation: sway 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .shadow { animation: sh 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .eye { animation: blink 4.8s infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .line { animation: fadeUp .7s cubic-bezier(.2,.8,.2,1) both; }
    .l1 { animation-delay: .15s; }
    .l2 { animation-delay: .75s; }
    .l3 { animation-delay: 1.35s; }
    .l4 { animation-delay: 1.95s; }
    .l5 { animation-delay: 2.55s; }
    .l6 { animation-delay: 3.15s; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes wave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-16deg); } }
    @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(6deg); } }
    @keyframes sh { 0%,100% { transform: scale(1); opacity: .18; } 50% { transform: scale(.92); opacity: .12; } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .bob, .arm, .ahoge, .shadow, .eye, .line { animation: none; }
    }
  </style>

  <g class="shadow"><ellipse cx="128" cy="277" rx="44" ry="8" fill="#0EA5E9" opacity=".18"/></g>

  <g transform="translate(38,14) scale(0.9)">
    <g class="bob">
      <rect x="78" y="250" width="17" height="34" rx="8" fill="#0F172A"/>
      <rect x="105" y="250" width="17" height="34" rx="8" fill="#0F172A"/>
      <rect x="68" y="276" width="32" height="14" rx="7" fill="#1E293B"/>
      <rect x="100" y="276" width="32" height="14" rx="7" fill="#1E293B"/>

      <path d="M62 192c0-20 17-34 38-34s38 14 38 34v52c0 9-5 14-14 14H76c-9 0-14-5-14-14z" fill="#0EA5E9"/>
      <path d="M74 164c8 10 18 15 26 15s18-5 26-15c-9-6-17-9-26-9s-17 3-26 9z" fill="#0284C7"/>
      <path d="M86 232h28v8c0 4-3 7-7 7h-14c-4 0-7-3-7-7z" fill="#0284C7" opacity=".85"/>
      <path d="M100 176v82" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round"/>

      <rect x="46" y="180" width="18" height="54" rx="9" fill="#38BDF8"/>
      <circle cx="55" cy="238" r="10" fill="#FFE0C2"/>

      <g class="arm">
        <rect x="136" y="178" width="18" height="54" rx="9" fill="#38BDF8"/>
        <circle cx="145" cy="236" r="10" fill="#FFE0C2"/>
      </g>

      <circle cx="44" cy="150" r="9" fill="#FFE0C2"/>
      <circle cx="156" cy="150" r="9" fill="#FFE0C2"/>
      <circle cx="100" cy="132" r="58" fill="#FFE8D6"/>

      <path d="M42 140c-4-48 20-74 58-74s62 26 58 74c-8-20-18-30-30-34-8 14-32 16-44 2-18 4-34 14-42 32z" fill="#13233B"/>
      <path d="M42 138c-6 22-4 40 2 52 6-14 6-32 6-48z" fill="#13233B"/>
      <path d="M158 138c6 22 4 40-2 52-6-14-6-32-6-48z" fill="#13233B"/>

      <g class="ahoge">
        <path d="M100 68c4-16 16-20 22-16" stroke="#13233B" stroke-width="5" fill="none" stroke-linecap="round"/>
      </g>

      <path d="M70 116l16-3" stroke="#13233B" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M114 113l16 3" stroke="#13233B" stroke-width="3.5" stroke-linecap="round"/>

      <g class="eye">
        <ellipse cx="80" cy="136" rx="7.5" ry="9.5" fill="#16233A"/>
        <circle cx="77" cy="132" r="2.6" fill="#FFFFFF" opacity=".9"/>
      </g>
      <g class="eye">
        <ellipse cx="120" cy="136" rx="7.5" ry="9.5" fill="#16233A"/>
        <circle cx="117" cy="132" r="2.6" fill="#FFFFFF" opacity=".9"/>
      </g>

      <ellipse cx="62" cy="152" rx="9" ry="5" fill="#FDA4AF" opacity=".5"/>
      <ellipse cx="138" cy="152" rx="9" ry="5" fill="#FDA4AF" opacity=".5"/>
      <path d="M92 158c4 5 12 5 16 0" stroke="#9A3412" stroke-width="3.2" fill="none" stroke-linecap="round"/>

      <path d="M44 128c4-40 26-56 56-56s52 16 56 56" stroke="#0F172A" stroke-width="8" fill="none" stroke-linecap="round"/>
      <rect x="30" y="118" width="16" height="30" rx="8" fill="#0F172A"/>
      <rect x="154" y="118" width="16" height="30" rx="8" fill="#0F172A"/>
      <circle cx="38" cy="133" r="3.5" fill="#38BDF8"/>
      <circle cx="162" cy="133" r="3.5" fill="#38BDF8"/>
    </g>
  </g>

  <path d="M232 152 L206 166 L232 180 Z" fill="#F8FAFC" stroke="#BAE6FD" stroke-width="3" stroke-linejoin="round"/>
  <rect x="232" y="48" width="474" height="272" rx="26" fill="#F8FAFC" stroke="#BAE6FD" stroke-width="3"/>

  <text class="line l1" x="268" y="104" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#0F172A">Hi, I&#39;m XiaoGao.</text>
  <text class="line l2" x="268" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#64748B">I build at both ends of the stack &#8212; firmware and AI.</text>

  <g class="line l3">
    <rect x="268" y="169" width="8" height="8" rx="2" fill="#0EA5E9"/>
    <text x="288" y="176" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#334155">Bare-metal C on STM32: 1 ms tick tables, PID loops</text>
  </g>
  <g class="line l4">
    <rect x="268" y="201" width="8" height="8" rx="2" fill="#0EA5E9"/>
    <text x="288" y="208" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#334155">Retrieval-grounded LLM apps &#8212; Neo4j, vector search</text>
  </g>
  <g class="line l5">
    <rect x="268" y="233" width="8" height="8" rx="2" fill="#0EA5E9"/>
    <text x="288" y="240" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#334155">17 handbooks, from analog circuits to ROS 2 and AI</text>
  </g>

  <text class="line l6" x="268" y="292" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-style="italic" fill="#0284C7">Built to run, not just to demo.</text>
</svg>
