name: update-profile-cards

on:
  schedule:
    # every day at 02:40 UTC
    - cron: '40 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: Ashleycurry
        run: node tools/gen-cards.cjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets; then
            echo "cards are already up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg assets/top-languages.svg
          git commit -m 'chore(cards): refresh profile stats'
          git push
